<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>addContact</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>

  <body>
    <div class="wrapper">
      <main>
        <!-- Menü/Nav  -->
        <ul class="nav-links" id="responsive">
          {{ account | safe}}

          <div class="nav-items">
            <a href="/index" class="active">Home</a>
            {{ portfolioMenu | safe}}
            <a href="javascript:void(0);" class="icon" id="burgermenutest">
              <i class="material-icons" style="font-size: 40px">reorder</i>
            </a>
          </div>
        </ul>

        <!--Profil box -->
        <div class="body_GridProfil">
          <h3>Willkommen.</h3>

          <a href="/profil/logout">
            <div class="button-logout">
              <i class="material-icons" style="font-size: 14px">input</i>Logout
            </div></a
          >

          <div class="profile-header">
            <div class="profile-image-container">
              <label for="profileImage">
                <img
                  src="/public/Bilder/LandingPagePic.jpg"
                  class="profile-image"
                />
              </label>
              <input
                type="file"
                id="profileImage"
                name="profileImage"
                accept="image/*"
              />
            </div>

            <span class="edit-text"
              ><i class="material-icons" style="font-size: 14px">edit</i>
              Profilbild ändern
            </span>
          </div>

          <!-- Upload box -->

          <div class="contact_heading-profil">
            <h3>Kontaktdaten</h3>
            {{ contact | safe}}
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer>
        <ul class="nav-linksFooter">
          <h5>More On This Site</h5>
          {{ logs | safe}}
          <li><a href="/dokumentation">Dokumentation</a></li>
          <li><a href="/projekttagebuch">Projekttagebuch</a></li>
          <li><a href="/kollophon">Kollophon</a></li>
          <li>
            <a href="/einversteandniserklearungen">Einverständniserklärungen</a>
          </li>
        </ul>
      </footer>
    </div>
  </body>
</html>
