<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>addContact</title>
    <link rel="stylesheet" href="/public/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>

  <body>
    <div class="wrapper">
      <main>
        <!-- Menü/Nav  -->
        <ul class="nav-links" id="responsive">
          <a href="/login">
            <i class="material-icons profil-icon">account_circle</i>
          </a>

          <div class="nav-items">
            <a href="/index">Home</a>
            <a href="/portfolio">Mein Portfolio</a>
            <a href="portfolio/erstellen" class="active">Portfolio erstellen</a>
          </div>
        </ul>


        <h3 class="h3_erstellePortfolio">Profil</h3>

          <!--Profil box -->
        <div class="body_GridProfil">
          <h3>Willkommen.</h3>

          <div  class="button-logout">Logout</div>

          <div class="profile-header">
            <div class="profile-image-container">

             
              <label for="profileImage">
                <img
                  src="/public/Bilder/LandingPagePic.jpg"
                  alt="Profilbild"
                  class="profile-image"/>
              </label>
              <input
                type="file"
                id="profileImage"
                name="profileImage"
                accept="image/*"/>
            </div>

            <span class="edit-text"
              ><i class="material-icons" style="font-size: 14px">edit</i>
              Profilbild ändern
            </span>

            <h4 class="profil-h4" id="username-profil">Username</h4>
            
            <!-- Upload box -->

            <div class="contact_heading">
              <h3>Kontaktdaten</h3>

              {{ contact | safe}}
            </div>
          </div>
        </div>
      </main>

      <footer>
        <ul class="nav-linksFooter">
          <h5>More On This Site</h5>
          <li><a href="ueber-uns">Über uns</a></li>
          <li><a href="kontakt">Kontakt</a></li>
          <li><a href="impressum">Impressum</a></li>
          <li><a href="datenschutz">Datenschutz</a></li>
          <li><a href="dokumentation">Dokumentation</a></li>
          <li><a href="kollophon">Kollophon</a></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
