<!DOCTYPE html>
<html lang="DE">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>

  <body>
    <div class="wrapper">
      <main>
        <!-- Menü/Nav  -->
        <ul class="nav-links" id="responsive">
          {{ account | safe}}

          <div class="nav-items">
            <a href="/index" class="active">Home</a>
            {{ portfolioMenu | safe}}
            <a href="javascript:void(0);" class="icon" id="burgermenutest">
              <i class="material-icons" style="font-size: 40px">reorder</i>
            </a>
          </div>
        </ul>

        <!-- Landing Page Pic  -->

        <div class="PortfolioDetailSite"> 

        <div class="container_LandingPage">
          <img
            class="container_LandingPage-img"
            src="/Bilder/LandingPagePic.jpg"
            alt="LandingPagePic"
          />

          <!-- Überschrift  -->
          <div class="left-heading">
            <h1>PortfolioCraft</h1> 
       
            {{ homepageText | safe}}
         
          </div>
        </div>

        <!-- Filter  -->
        <div id="myBtnContainer">
          <a href="/index"> <button class="btn Filter">Alles</button></a>
          <a href="/index?tags=3D-Animation">
            <button class="btn Filter">3D-Animation</button></a
          >
          <a href="/index?tags=Motion-Graphics"
            ><button class="btn Filter">Motion Graphics</button></a
          >
          <a href="/index?tags=Softwareentwicklung"
            ><button class="btn Filter">Softwareentwicklung</button></a
          >
          <a href="/index?tags=2D-Art"
            ><button class="btn Filter">2D-Art</button></a
          >
          <a href="/index?tags=Animation"
            ><button class="btn Filter">Animation</button></a
          >
          <a href="/index?tags=Webdesign"
            ><button class="btn Filter">Webdesign</button></a
          >
        </div>

        <!-- Portfolio linksbündig  -->
        {{ portfolios | safe}}

      </div>
      </main>

      <!-- Footer -->

      <footer>
        <ul class="nav-linksFooter">
          <h5>More On This Site</h5>
          <li><a href="ueber-uns">Über uns</a></li>
          <li><a href="kontakt">Kontakt</a></li>
          <li><a href="impressum">Impressum</a></li>
          <li><a href="datenschutz">Datenschutz</a></li>
          <li><a href="dokumentation">Dokumentation</a></li>
          <li><a href="kollophon">Kollophon</a></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
