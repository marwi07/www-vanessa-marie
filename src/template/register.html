<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrieren</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>

  <body>
    <div class="wrapper">
      <main>
        <!-- Menü/Nav  -->
        <ul class="nav-links" id="responsive">
          {{ account | safe}}

          <div class="nav-items">
            <a href="/index" class="active">Home</a>
            {{ portfolioMenu | safe}}
            <a href="javascript:void(0);" class="icon" id="burgermenutest">
              <i class="material-icons" style="font-size: 40px">reorder</i>
            </a>
          </div>
        </ul>

        <!-- Register -->
        <div class="body_GridLogin">
          <div class="container_login">
            <h2>Registrieren</h2>

            <form id="registerForm" action="/addRegister" method="POST">
              {% if errors %}
              <div class="errors">
                <ul>
                  {% for error in errors %}
                  <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              </div>
              {% endif %}
              <label for="username">Username:</label>
              <input
                type="text"
                id="username"
                name="username"
                value="{{data.username}}"
              />
              <label for="password">Password:</label>
              <input type="password" id="password" name="password" />

              <div class="button-group-login-register">
                <a href="/login" type="button" class="button-group_login"
                  >Login</a
                >
                <button type="submit" class="button-group_login">
                  Registrieren
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>

      <!--Footer -->
      <footer>
        <ul class="nav-linksFooter">
          <h5>More On This Site</h5>
          <li><a href="dokumentation">Dokumentation</a></li>
          <li><a href="projekttagebuch">Projekttagebuch</a></li>
          <li><a href="kollophon">Kollophon</a></li>
          <li><a href="einversteandniserklearungen">Einverständniserklärungen</a></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
