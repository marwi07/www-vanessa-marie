<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>addContact</title>
    <link href="/css/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>

  <body>
    <div class="wrapper">
      <main>

        <!-- Menü/Nav  -->
        <ul class="nav-links" id="responsive">
          <a href="/login">
            <i class="material-icons profil-icon">account_circle</i>
          </a>

          <div class="nav-items">
            <a href="/index">Home</a>
            <a href="/portfolio">Mein Portfolio</a>
            <a href="portfolio/erstellen" class="active">Portfolio erstellen</a>
          </div>
        </ul>


    <!-- Upload box -->

    <h3 class="h3_erstellePortfolio">Füge deine Kontaktdaten hinzu!</h3>

        <div class="body_GridContact">
      
            <div class="header-container">

              <h4>Kontaktdaten</h4>
              
          </div>

            <div id="message-container"></div>

            <form id="contactForm" action="/addContact" method="POST">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" />
              <label for="email">E-Mail:</label>
              <input maxlength="100" type="text" id="email" name="email" />
              <label for="telefon">Telefon:</label>
              <input type="number" id="telefon" name="telefon" maxlength="20" />
              <label for="address">Adresse:</label>
              <input type="text" id="address" name="address" />
              <label for="extra">Sonstiges:</label>
              <input type="text" id="extra" name="extra" />
              
              <button type="submit" class="button-save">
                Speichern </button>
            </form>
         
        </div>
      </main>

      <footer>
        <ul class="nav-linksFooter">
          <h5>More On This Site</h5>
          <li><a href="ueber-uns">Über uns</a></li>
          <li><a href="kontakt">Kontakt</a></li>
          <li><a href="impressum">Impressum</a></li>
          <li><a href="datenschutz">Datenschutz</a></li>
          <li><a href="dokumentation">Dokumentation</a></li>
          <li><a href="kollophon">Kollophon</a></li>
        </ul>
      </footer>
    </div>
  </body>
</html>
